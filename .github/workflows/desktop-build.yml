name: Production Desktop Compile (Manual)

on:
  workflow_dispatch: # On-demand execution only

jobs:
  compile-desktop:
    name: Compile for Windows
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. PINNED ENVIRONMENT SETUP
      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      # 2. RUNNER DEPENDENCY CACHING
      - name: Cache Flutter Pub Packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # 3. WINDOWS NATIVE EXECUTION BLOCK
      - name: Compile Windows Bundle
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release
        shell: pwsh

      # 4. INSTALL INNO SETUP
      - name: Install Inno Setup
        run: choco install innosetup -y
        shell: pwsh

      # 5. GENERATE SINGLE SETUP EXE USING INNO SETUP
      - name: Create Single Setup Exe
        run: |
          $issContent = @"
          [Setup]
          AppName=Galaxy News
          AppVersion=1.0
          DefaultDirName={autopf}\GalaxyNews
          DefaultGroupName=Galaxy News
          OutputDir=.
          OutputBaseFilename=GalaxyNews_Setup
          Compression=lzma2
          SolidCompression=yes
          PrivilegesRequired=lowest

          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\Galaxy News"; Filename: "{app}\galaxynews.exe"
          Name: "{autodesktop}\Galaxy News"; Filename: "{app}\galaxynews.exe"; Tasks: desktopicon

          [Tasks]
          Name: "desktopicon"; Description: "Create a &desktop icon"; GroupDescription: "Additional icons:"; Flags: unchecked
          "@
          
          Set-Content -Path "installer.iss" -Value $issContent
          
          # Add Inno Setup CLI to path for the current session and compile
          $env:Path += ";C:\Program Files (x86)\Inno Setup 6"
          iscc installer.iss
        shell: pwsh

      # 6. UPLOAD SETUP EXE ARTIFACT
      - name: Save Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: galaxynews-setup-exe-${{ github.run_number }}
          path: GalaxyNews_Setup.exe
